name: Update TWSE institutional and margin data

on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-tw-market.yml', 'scripts/sync-tw-market.cjs']
  schedule:
    # GitHub scheduled events are best-effort and can be delayed or skipped.
    # Retry through the Taiwan evening so delayed TWSE margin publication gets picked up.
    # Times below are UTC: 18:20, 19:20, 20:20, 21:20, 22:20 Asia/Taipei.
    - cron: '20 10-14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-tw-market
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and validate official TWSE snapshots
        run: node scripts/sync-tw-market.cjs
      - name: Commit validated data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- assets/data/tw-market-snapshot.json)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/tw-market-snapshot.json
          git commit -m "data: refresh TWSE institutional, margin and closes"
          git push
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
