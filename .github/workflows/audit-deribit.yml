name: Audit and archive Deribit BTC options quotes
on:
  pull_request:
    paths: ['scripts/record-deribit.cjs', '.github/workflows/audit-deribit.yml', 'assets/js/options-execution.js']
  push:
    branches: [main]
    paths: ['scripts/record-deribit.cjs', '.github/workflows/audit-deribit.yml']
  schedule:
    - cron: '11 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: audit-deribit-quotes
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit real Deribit production order books
        run: node scripts/record-deribit.cjs
      - name: Publish validated quote history
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- assets/data/deribit)" ]; then
            echo "No new validated data"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/deribit
          git commit -m "data: record verified Deribit BTC option books"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
