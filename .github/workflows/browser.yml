name: Playwright browser tests

on:
  pull_request:
  push:
    branches: [main]
    # Data-only bot commits do not need a full browser/regression suite.
    paths-ignore:
      - 'assets/data/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    # Playwright 1.56 does not install Chromium on the ubuntu-latest 26.04 image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Kept separate from the existing jsdom lockfile to avoid modifying production deps.
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload traces, screenshots and HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
